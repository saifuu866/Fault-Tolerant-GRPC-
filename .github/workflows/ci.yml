name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Protocol Buffers
        run: |
          python generate_protos.py

      - name: Verify generated stubs exist
        shell: bash
        run: |
          test -f generated/service_pb2.py || { echo "service_pb2.py missing"; exit 1; }
          test -f generated/service_pb2_grpc.py || { echo "service_pb2_grpc.py missing"; exit 1; }
          echo "Protocol Buffers successfully generated and verified."

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

  smoke-test:
    name: Smoke Test Cluster Lifecycle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stubs
        run: |
          python generate_protos.py

      - name: Start backend servers in background
        run: |
          python servers/server.py --id server-1 --port 50051 &
          python servers/server.py --id server-2 --port 50052 &
          python servers/server.py --id server-3 --port 50053 &
          sleep 3

      - name: Run CLI client against live cluster
        run: |
          python client/rpc_client.py --operation echo --payload "CI smoke test" --count 3
          python client/rpc_client.py --operation sum --payload "10,20,30" --count 3
          python client/rpc_client.py --operation square --payload "8" --count 3
